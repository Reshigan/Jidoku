[project]
name = "jidoka-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "jidoka-core", "jidoka-adapters", "jidoka-compiler", "pyjwt[crypto]>=2.8"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
