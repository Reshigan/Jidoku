[project]
name = "jidoka-knowledge"
version = "0.1.0"
description = "JIDOKA memory: evidence-grounded claims, project/system stores, deterministic staleness"
requires-python = ">=3.11"
dependencies = ["jidoka-core"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
