[project]
name = "jidoka-compiler"
version = "0.1.0"
description = "Design workbooks -> Config IR with cell-level provenance"
requires-python = ">=3.11"
dependencies = ["jidoka-core", "openpyxl>=3.1"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
