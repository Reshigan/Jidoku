[project]
name = "jidoka-adapters"
version = "0.2.0"
description = "JIDOKA adapter SDK + SAP product adapters"
requires-python = ">=3.11"
dependencies = ["jidoka-core"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
