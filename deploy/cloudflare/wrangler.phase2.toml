# Phase 2 — Workers-native kernel. NOT DEPLOYED YET; kept so the target shape stays visible.
#
# Promoting this is gated on one thing, from deploy/cloudflare/README.md: "every gate that exists
# in jidoka-core must exist identically here before any tenant goes live."
#
# The ledger half of that gate is now met and checkable: src/chain.mjs is the DO's chain, and
# src/ledger.check.mjs holds it to packages/jidoka-core/tests/fixtures/ledger_conformance.json —
# the same operations, the same hashes, the same refusal messages, byte for byte — beside the
# Python suite held to the same file. CI runs both (ADR-0037).
#
# What is still missing before a tenant: the registry's write-lock, the executor's arming and
# snapshot gates, the decision engine's STATUTORY and ONE_WAY rules. None of them is ported, and
# the ledger being done is not the same as the kernel being done.
name = "jidoka-kernel"
main = "src/kernel.ts"
compatibility_date = "2026-08-01"

[[durable_objects.bindings]]
name = "LEDGER"                 # one DO per engagement: ordering + hash chain by construction
class_name = "EngagementLedger"

[[d1_databases]]
binding = "TENANT_DB"           # provisioned per tenant by the org-onboarding worker
database_name = "jidoka-tenant-template"
database_id = "REPLACE_AT_PROVISIONING"

[[r2_buckets]]
binding = "EVIDENCE"
bucket_name = "jidoka-evidence" # per-tenant prefixes; EU jurisdiction for POPIA-adequate residency

[[queues.producers]]
binding = "JOBS"
queue = "jidoka-jobs"           # extract / diff / verification-suite / release-readiness

[triggers]
crons = ["0 2 * * *"]           # nightly consistency + drift classification

[vars]
AI_GATEWAY = "https://gateway.ai.cloudflare.com/v1/ACCOUNT/jidoka/anthropic"
