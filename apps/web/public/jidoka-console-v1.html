<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>goNXT JIDOKA — Andon Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Poppins:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Factory floor — not pure black; the charcoal of a machine shop at night */
  --floor:#0E1116; --floor-2:#151A22; --floor-3:#1C222C; --line:#28313E;
  /* Andon lamps — real signal-tower colours, slightly desaturated so they read as glass not neon */
  --lamp-run:#3FB950; --lamp-call:#E3A008; --lamp-stop:#E5484D; --lamp-off:#2A323D;
  /* goNXT brand thread */
  --nxt:#2B50E2; --navy:#0A1245; --ink:#E8ECF3; --ink-2:#98A3B4; --ink-3:#5D6877;
  --focus:#6E8BFF;
  --disp:'Archivo Narrow','Oswald',Impact,sans-serif;
  --body:'Poppins','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--floor);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:none}
.mono{font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;font-size:10px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:88px 1fr;min-height:100vh}
/* Signature element: the andon lamp rail — the line's true state, always visible, never scrolled away */
.rail{background:var(--floor-2);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;
      display:flex;flex-direction:column;align-items:center;padding:18px 0 14px;gap:14px;z-index:20}
.mark{width:44px;height:44px;flex:none}
.rail-lamps{display:flex;flex-direction:column;gap:7px;flex:1;justify-content:center;width:100%;align-items:center}
.lamp{width:46px;height:34px;border-radius:5px;background:var(--lamp-off);position:relative;
      display:flex;align-items:center;justify-content:center;border:1px solid #000;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.06);transition:background .35s,box-shadow .35s}
.lamp span{font-family:var(--mono);font-size:9px;color:#0009;font-weight:500}
.lamp[data-s="run"]{background:var(--lamp-run);box-shadow:0 0 16px -2px var(--lamp-run),inset 0 1px 0 rgba(255,255,255,.35)}
.lamp[data-s="call"]{background:var(--lamp-call);box-shadow:0 0 16px -2px var(--lamp-call),inset 0 1px 0 rgba(255,255,255,.35)}
.lamp[data-s="stop"]{background:var(--lamp-stop);box-shadow:0 0 18px -1px var(--lamp-stop),inset 0 1px 0 rgba(255,255,255,.35);animation:pulse 1.6s infinite}
.lamp[data-s="off"] span{color:#5D6877}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.62}}
@media (prefers-reduced-motion:reduce){.lamp[data-s="stop"]{animation:none}*{transition:none!important}}
/* The cord: anyone can stop the line. Toyota's rule, made literal. */
.cord{width:100%;display:flex;flex-direction:column;align-items:center;gap:0}
.cord-wire{width:2px;height:26px;background:linear-gradient(var(--line),var(--ink-3))}
.cord-grip{width:34px;height:34px;border-radius:50%;background:var(--lamp-stop);border:2px solid #7d1c1f;
  font-family:var(--disp);font-size:10px;letter-spacing:.06em;color:#fff;display:grid;place-items:center;
  transition:transform .18s}
.cord-grip:hover,.cord-grip:focus-visible{transform:translateY(4px)}

/* ---------- header ---------- */
main{min-width:0}
header{position:sticky;top:0;background:rgba(14,17,22,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:14px 26px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;z-index:15}
.brandline{display:flex;align-items:baseline;gap:10px}
.wordmark{font-family:var(--disp);font-size:22px;font-weight:700;letter-spacing:.01em}
.wordmark .go{color:#fff}.wordmark .nxt{color:var(--nxt)}
.jid{font-family:var(--disp);font-weight:600;font-size:22px;letter-spacing:.14em;color:var(--ink)}
.kanji{font-size:13px;color:var(--ink-3);letter-spacing:.1em}
nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
nav button{padding:7px 13px;border-radius:7px;font-size:12px;font-weight:500;color:var(--ink-2)}
nav button:hover{background:var(--floor-3);color:var(--ink)}
nav button[aria-current="page"]{background:var(--nxt);color:#fff}
.env{font-family:var(--mono);font-size:10px;padding:5px 10px;border:1px solid var(--line);border-radius:6px;color:var(--ink-2)}
.env b{color:var(--lamp-call)}

/* ---------- layout ---------- */
.wrap{padding:26px;max-width:1240px;margin:0 auto}
.eyebrow{font-family:var(--mono);font-size:10px;color:var(--nxt);margin-bottom:6px}
h1{font-family:var(--disp);font-size:30px;font-weight:600;letter-spacing:.01em;margin-bottom:4px}
h2{font-family:var(--disp);font-size:19px;font-weight:600;letter-spacing:.02em;margin-bottom:2px}
.sub{color:var(--ink-2);font-size:13px;margin-bottom:20px;max-width:70ch}
.card{background:var(--floor-2);border:1px solid var(--line);border-radius:12px;padding:18px}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
hr.rule{border:0;border-top:1px solid var(--line);margin:26px 0}

/* status readouts — the big number is earned, so it gets the display face */
.readout .fig{font-family:var(--disp);font-size:42px;font-weight:700;line-height:1;letter-spacing:-.01em}
.readout .lab{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-top:7px}
.readout .note{font-size:12px;color:var(--ink-2);margin-top:8px}
.fig.run{color:var(--lamp-run)}.fig.call{color:var(--lamp-call)}.fig.stop{color:var(--lamp-stop)}.fig.blue{color:var(--nxt)}

/* gate cards */
.gate{background:var(--floor-2);border:1px solid var(--line);border-left:3px solid var(--lamp-off);
  border-radius:10px;padding:14px 16px;margin-bottom:10px}
.gate[data-s="run"]{border-left-color:var(--lamp-run)}
.gate[data-s="call"]{border-left-color:var(--lamp-call)}
.gate[data-s="stop"]{border-left-color:var(--lamp-stop)}
.gate-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.gate h3{font-size:14px;font-weight:500}
.gate .meta{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);margin-top:5px}
.pill{font-family:var(--mono);font-size:9px;padding:3px 8px;border-radius:20px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.pill.oneway{border-color:#7d5a10;background:#3a2c07;color:#F0C14B}
.pill.blocked{border-color:#7d1c1f;background:#3a1113;color:#FF9DA1}
.pill.earned{border-color:#1d5c33;background:#0f2e1c;color:#7EE39A}
.steps{display:flex;gap:5px;margin-top:12px;flex-wrap:wrap}
.step{flex:1;min-width:64px;height:4px;border-radius:2px;background:var(--lamp-off)}
.step.done{background:var(--lamp-run)}.step.now{background:var(--nxt)}
.steplab{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.steplab span{flex:1;min-width:64px;font-family:var(--mono);font-size:8.5px;color:var(--ink-3)}
.actions{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
.btn{padding:7px 13px;border-radius:7px;font-size:12px;font-weight:500;border:1px solid var(--line);background:var(--floor-3)}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--nxt);border-color:var(--nxt);color:#fff}
.btn.stop{background:transparent;border-color:#7d1c1f;color:#FF9DA1}
.btn:disabled{opacity:.38;cursor:not-allowed}

/* tables */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--mono);font-size:9px;color:var(--ink-3);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-weight:500}
td{padding:11px 10px;border-bottom:1px solid var(--floor-3);vertical-align:top}
tr:last-child td{border-bottom:0}
.trunc{max-width:34ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}

/* ledger */
.chain{font-family:var(--mono);font-size:10.5px;letter-spacing:0;text-transform:none}
.chain-row{display:grid;grid-template-columns:132px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--floor-3)}
.chain-row .h{color:var(--ink-3);overflow:hidden;text-overflow:ellipsis}
.verified{color:var(--lamp-run)}

/* banners */
.banner{border-radius:10px;padding:13px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:flex-start;font-size:13px}
.banner.stop{background:#2a0f11;border:1px solid #7d1c1f;color:#FFC9CB}
.banner.call{background:#2b2107;border:1px solid #7d5a10;color:#F4D58D}
.banner.info{background:#0f1733;border:1px solid #23306b;color:#B9C6FF}
.banner b{display:block;margin-bottom:2px}

/* empty / loading / error */
.empty{text-align:center;padding:56px 20px;border:1px dashed var(--line);border-radius:12px}
.empty h2{color:var(--ink);margin-bottom:6px}
.empty p{color:var(--ink-2);max-width:44ch;margin:0 auto 16px}
.skel{background:linear-gradient(90deg,var(--floor-2) 25%,var(--floor-3) 50%,var(--floor-2) 75%);
  background-size:200% 100%;animation:sh 1.3s infinite;border-radius:8px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(5,7,10,.72);display:grid;place-items:center;padding:20px;z-index:50}
.modal{background:var(--floor-2);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:460px;width:100%}
.modal h2{margin-bottom:8px}
.modal p{color:var(--ink-2);font-size:13px;margin-bottom:14px}
label.f{display:block;margin-bottom:12px}
label.f span{font-family:var(--mono);font-size:9px;color:var(--ink-3);display:block;margin-bottom:5px}
input[type=text],textarea,select{width:100%;background:var(--floor);border:1px solid var(--line);border-radius:7px;
  padding:9px 11px;color:var(--ink);font-family:inherit;font-size:13px}
textarea{min-height:74px;resize:vertical}

/* toast */
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:9px;z-index:60;max-width:340px}
.toast{background:var(--floor-3);border:1px solid var(--line);border-left:3px solid var(--nxt);border-radius:9px;
  padding:11px 14px;font-size:12.5px;animation:slide .22s ease-out}
.toast.stop{border-left-color:var(--lamp-stop)}
.toast.run{border-left-color:var(--lamp-run)}
@keyframes slide{from{transform:translateX(14px);opacity:0}to{transform:none;opacity:1}}

/* analytics */
.chartcard h2{margin-bottom:2px}
.chartcard .sub{margin-bottom:14px;font-size:12px}
svg .ax{stroke:var(--line);stroke-width:1}
svg .gl{stroke:var(--floor-3);stroke-width:1}
svg text{font-family:var(--mono);font-size:9px;fill:var(--ink-3);letter-spacing:.06em}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-family:var(--mono);font-size:9px;color:var(--ink-3)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

footer{border-top:1px solid var(--line);padding:20px 26px;color:var(--ink-3);
  font-family:var(--mono);font-size:9px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}

@media(max-width:760px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;bottom:0;top:auto;height:auto;width:100%;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:9px 12px}
  .rail-lamps{flex-direction:row;gap:5px}
  .lamp{width:34px;height:26px}
  .cord{flex-direction:row;align-items:center;width:auto}.cord-wire{width:18px;height:2px}
  .wrap{padding:18px 16px 96px}
  h1{font-size:24px}
}
</style>
</head>
<body>
<div class="shell">

<!-- ============ ANDON RAIL (signature) ============ -->
<aside class="rail" aria-label="Line status">
  <svg class="mark" viewBox="0 0 44 44" role="img" aria-label="goNXT JIDOKA">
    <rect x="0" y="0" width="44" height="44" rx="10" fill="#0A1245"/>
    <rect x="13" y="7"  width="18" height="8" rx="2" fill="#E5484D"/>
    <rect x="13" y="18" width="18" height="8" rx="2" fill="#E3A008"/>
    <rect x="13" y="29" width="18" height="8" rx="2" fill="#3FB950"/>
    <rect x="20" y="15" width="4"  height="14" fill="#2B50E2"/>
  </svg>
  <div class="rail-lamps" id="railLamps"></div>
  <div class="cord">
    <div class="cord-wire"></div>
    <button class="cord-grip" id="cordBtn" title="Stop the line" aria-label="Stop the line">STOP</button>
  </div>
</aside>

<main>
<header>
  <div class="brandline">
    <span class="wordmark"><span class="go">go</span><span class="nxt">NXT</span></span>
    <span class="jid">JIDOKA</span>
    <span class="kanji">自働化</span>
  </div>
  <nav id="nav" aria-label="Sections"></nav><button class="env" onclick="openPalette()" title="Command palette">⌘K</button>
  <span class="env" title="Night shift complete"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--lamp-run);margin-right:6px;vertical-align:1px"></span>ON SHIFT · <b id="envName">DEV</b></span>
</header>

<div class="wrap" id="view" role="main" aria-live="polite"></div>

<footer>
  <span>goNXT · What Comes Next is Built Here — and here, it is proven</span>
  <span id="footState">Ledger chain verified · 09:42 SAST</span>
</footer>
</main>
</div>

<div id="modalHost"></div>
<div class="toasts" id="toasts" aria-live="assertive"></div>

<script>
/* ================= state ================= */
const S={
  view:'line', env:'DEV', loading:true, offline:false, chainOk:true, lineStopped:false, stopReason:'',
  engagementLoaded:true,
  gates:[
    {id:'P1-3',t:'Succession Data Model delta upload',layer:'XML',oneway:false,step:4,status:'call',
     owner:'C. Muunganirwa',reviewer:null,snap:'git 8f2a1c · Check Tool CT-1187'},
    {id:'P3-2',t:'Legal Entity load — externalCode = ECC company code',layer:'FO',oneway:false,step:5,status:'run',
     owner:'S. Lavu',reviewer:'L. Chadhliwa',snap:'EXP-2026-0912-03 · 41 rows'},
    {id:'P3-3',t:'Cost centre replication iFlow ECC→EC',layer:'INT',oneway:false,step:2,status:'call',
     owner:'N. Devatala',reviewer:null,snap:'—'},
    {id:'P7-1',t:'Time Off — Mozambique calendars & accruals',layer:'TO',oneway:false,step:0,status:'stop',
     owner:'—',reviewer:null,snap:'—',blocked:'DP-B14'},
    {id:'P8-4',t:'Production cutover load — 18-step sequence',layer:'EMP',oneway:true,step:0,status:'call',
     owner:'—',reviewer:null,snap:'—'}
  ],
  dps:[
    {id:'DP-B14',type:'STATUTORY',q:'Mozambique annual leave: 22 or 30 working days after year one?',owner:'Komatsu HR MZ / counsel',age:11,cost:'ZAR 48k/wk',blocks:'P7-1 + 6 downstream'},
    {id:'DP-B01',type:'SEQUENCE',q:'Provisioning access route — partner access or SAP ticket?',owner:'Komatsu IT',age:3,cost:'Day-for-day slip',blocks:'P0 · all phases'},
    {id:'DP-B06',type:'ONE_WAY',q:'Person ID strategy — ECC PERNR or new EC range?',owner:'Komatsu IT + HR',age:6,cost:'Irreversible after first load',blocks:'P8-1'},
    {id:'DP-M00',type:'COMMERCIAL',q:'Wave 2 module licences — confirm entitlement in writing',owner:'Komatsu procurement',age:19,cost:'Wave 2 unplannable',blocks:'M1–M9'}
  ],
  ledger:[
    {ts:'09:41:07',task:'P3-2',act:'APPROVED',who:'L. Chadhliwa',h:'a17c…9f2b'},
    {ts:'09:38:52',task:'P3-2',act:'POST-VALIDATED',who:'jidoka',h:'6d02…41ae'},
    {ts:'09:22:14',task:'P3-2',act:'EXECUTED',who:'S. Lavu',h:'be93…07c1'},
    {ts:'09:19:03',task:'P3-2',act:'SNAPSHOT',who:'jidoka',h:'2f5a…bb80'},
    {ts:'08:55:41',task:'DP-B14',act:'DP_RAISED',who:'jidoka',h:'91e7…3d44'},
    {ts:'08:02:10',task:'P7-1',act:'PLAN_BLOCKED',who:'jidoka',h:'0c48…7a19'}
  ],
  refusals:[
    {ts:'Today 08:02',what:'Refused to plan MZ Time Off without a signed statutory source',rule:'R-705'},
    {ts:'Yesterday',what:'Refused approval — reviewer equals builder',rule:'SoD'},
    {ts:'Yesterday',what:'Refused write to KOM-ECC-PRD (source system, read-only)',rule:'R-101'},
    {ts:'2 days ago',what:'Refused load without restore snapshot',rule:'Rollback §01'}
  ]
};
const VIEWS=[['line','Line'],['handover','Handover'],['impact','Impact'],['gates','Gates'],['decisions','Decisions'],['evidence','Evidence'],['analytics','Analytics']];
const LAMP_PHASES=[['P0','run'],['P1','call'],['P2','run'],['P3','call'],['P4','off'],['P6','off'],['P7','stop'],['P8','off'],['P9','off'],['P10','off']];

/* ================= helpers ================= */
const $=(id)=>document.getElementById(id);
function toast(msg,kind=''){const t=document.createElement('div');t.className='toast '+kind;t.textContent=msg;
  $('toasts').appendChild(t);setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300)},4200);}
function modal(html,onMount){$('modalHost').innerHTML=`<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const first=$('modalHost').querySelector('input,textarea,button');first&&first.focus();
  $('scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeModal()});
  document.addEventListener('keydown',escClose);onMount&&onMount();}
function closeModal(){$('modalHost').innerHTML='';document.removeEventListener('keydown',escClose)}
function escClose(e){if(e.key==='Escape')closeModal()}
const STEPS=['Pre-flight','Snapshot','Execute','Verify','Approve'];

/* ================= views ================= */
function vLine(){
  const running=S.gates.filter(g=>g.status==='run').length;
  const calling=S.gates.filter(g=>g.status==='call').length;
  const stopped=S.gates.filter(g=>g.status==='stop').length;
  return `
  ${S.lineStopped?`<div class="banner stop"><div><b>Line stopped</b>${S.stopReason||'Halt raised from the andon cord. Nothing executes until a reviewer clears it.'}</div></div>`:''}
  ${!S.chainOk?`<div class="banner stop"><div><b>Evidence chain broken at entry 0c48…7a19</b>Approvals are suspended. Export the chain and contact the platform owner — do not continue building.</div></div>`:''}
  ${S.offline?`<div class="banner call"><div><b>Working offline</b>Showing the last verified state from 09:42. Nothing will be written until the connection returns.</div></div>`:''}
  <div class="banner info"><div><b>I worked the night shift and left you a handover</b>Two things need a person this morning, one of them is mine to fix and I have drafted it. <button class="btn" style="margin-top:8px" onclick="go('handover')">Read the handover</button></div></div>
  <p class="eyebrow">Komatsu Southern Africa · SuccessFactors greenfield · Wave 1</p>
  <h1>The line, right now</h1>
  <p class="sub">Every status here is earned from an approved checkpoint. Nothing on this board can be typed in by hand.</p>

  <div class="grid g3" style="margin-bottom:20px">
    <div class="card readout"><div class="fig ${stopped?'stop':'run'}">${stopped?'STOPPED':'RUNNING'}</div>
      <div class="lab">Line state</div>
      <div class="note">${stopped?`${stopped} station halted — Mozambique Time Off, waiting on a signed statutory source.`:'All stations feeding.'}</div></div>
    <div class="card readout"><div class="fig blue">0.62</div><div class="lab">P(go-live ≤ 1 Dec)</div>
      <div class="note">Up from 0.54 last week. Closing DP-B14 moves it most: +0.19.</div></div>
    <div class="card readout"><div class="fig call">${calling}</div><div class="lab">Waiting on a person</div>
      <div class="note">Approver capacity, not build capacity, is the constraint this week.</div></div>
  </div>

  <div class="grid g2">
    <div class="card">
      <h2>Stations</h2><p class="sub" style="margin-bottom:14px">Live station state across the build.</p>
      ${S.gates.map(g=>`<div class="gate" data-s="${g.status}">
        <div class="gate-top">
          <div><h3>${g.id} · ${g.t}</h3>
            <div class="meta">${g.layer} · ${g.owner==='—'?'unassigned':'built by '+g.owner}${g.snap!=='—'?' · '+g.snap:''}</div></div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            ${g.oneway?'<span class="pill oneway">One-way</span>':''}
            ${g.blocked?`<span class="pill blocked">Blocked · ${g.blocked}</span>`:''}
            ${g.status==='run'?'<span class="pill earned">Earned</span>':''}
          </div>
        </div>
        <div class="steps">${STEPS.map((_,i)=>`<div class="step ${i<g.step?'done':i===g.step&&!g.blocked?'now':''}"></div>`).join('')}</div>
        <div class="steplab">${STEPS.map(s=>`<span>${s}</span>`).join('')}</div>
      </div>`).join('')}
    </div>

    <div>
      <div class="card" style="margin-bottom:14px">
        <h2>What it refused</h2>
        <p class="sub" style="margin-bottom:12px">The most useful thing this platform does is decline. Four refusals in the last 48 hours.</p>

/* ================= interactions & edge cases ================= */
function advance(i){
  const g=S.gates[i];
  if(g.step===4){ // approval requires a different person
    modal(`<h2>Approve ${g.id}</h2><p>The person approving cannot be the person who built it. ${g.owner} executed this checkpoint.</p>
      <label class="f"><span>Reviewer initials</span><input type="text" id="rev" placeholder="e.g. L. Chadhliwa"></label>
      <div class="actions"><button class="btn primary" onclick="doApprove(${i})">Approve gate</button>
      <button class="btn" onclick="closeModal()">Cancel</button></div>`);
    return;
  }
  if(g.step===1&&!g.snapSet){
    modal(`<h2>Capture the before state</h2><p>Nothing executes without somewhere to return to. Record the export reference and row count.</p>
      <label class="f"><span>Export or Git reference</span><input type="text" id="ref" placeholder="EXP-2026-0918-01"></label>
      <label class="f"><span>Row count</span><input type="text" id="cnt" placeholder="1,482"></label>
      <div class="actions"><button class="btn primary" onclick="doSnap(${i})">Capture snapshot</button>
      <button class="btn" onclick="closeModal()">Cancel</button></div>`);
    return;
  }
  g.step++;g.status=g.step>=5?'run':'call';render();
  toast(`${g.id} — ${STEPS[Math.min(g.step-1,4)]} recorded on the chain.`,'run');
}
function doSnap(i){const r=$('ref').value.trim();
  if(!r){toast('A snapshot reference is required. Without it there is no way back.','stop');return}
  S.gates[i].snap=r;S.gates[i].snapSet=true;S.gates[i].step++;closeModal();render();
  toast('Snapshot captured. The station can now execute.','run');}
function doApprove(i){const r=$('rev').value.trim();
  if(!r){toast('Reviewer initials are required.','stop');return}
  if(r.toLowerCase()===S.gates[i].owner.toLowerCase()){
    closeModal();wrongApprover();return;}
  S.gates[i].step=5;S.gates[i].status='run';S.gates[i].reviewer=r;closeModal();render();
  toast(`${S.gates[i].id} approved by ${r}. Gate earned.`,'run');}
function wrongApprover(){
  modal(`<h2>That approval was refused</h2>
    <p>The reviewer and the builder are the same person. Separation of duties is enforced in the platform kernel, so this cannot be overridden here — or from any other client.</p>
    <p style="color:var(--ink-3);font-size:12px">Ask a second qualified reviewer to approve. The refusal has been recorded on the chain.</p>
    <div class="actions"><button class="btn primary" onclick="closeModal()">Understood</button></div>`);
  S.refusals.unshift({ts:'Just now',what:'Refused approval — reviewer equals builder',rule:'SoD'});}
function showRollback(id,layer){
  const proc={XML:'Re-upload the previous XML version from Git, then run the data model checks. Hidden fields keep their data; changing a populated field type does not roll back.',
    FO:'Re-import the before snapshot for this object. In production use an effective-dated correction — a full purge would destroy history.',
    INT:'Redeploy the previous iFlow version. The ECC side is Komatsu-owned; use the joint procedure.',
    EMP:'Reload the full 18-portlet snapshot before go-live. After go-live, correct forward per portlet.',
    TO:'Re-import the balance snapshot and re-run a targeted recalculation.'}[layer]||'Restore from the recorded snapshot.';
  modal(`<h2>Roll back ${id}</h2><p>${proc}</p>
    <label class="f"><span>Why are you rolling back?</span><textarea id="why" placeholder="Recorded on the chain and reviewed at the next gate"></textarea></label>
    <div class="actions"><button class="btn stop" onclick="doRollback('${id}')">Roll back</button>
    <button class="btn" onclick="closeModal()">Cancel</button></div>`);}
function doRollback(id){const w=$('why').value.trim();
  if(!w){toast('A reason is required. Rollbacks teach the system what to prevent.','stop');return}
  const g=S.gates.find(x=>x.id===id);g.step=0;g.status='call';g.snapSet=false;closeModal();render();
  toast(`${id} rolled back and reset. The reason is on the chain.`,'');}
function resolveDP(id,type){
  if(type==='STATUTORY'){
    modal(`<h2>${id}</h2>
      <p>This is a statutory question. JIDOKA holds two conflicting figures from unsigned sources and will not choose between them — a wrong entitlement is a payroll breach, not a defect.</p>
      <p style="color:var(--ink-3);font-size:12px">To release this decision, attach a signed position from Komatsu HR Mozambique or counsel. Six stations open the moment it lands.</p>
      <label class="f"><span>Signed source reference</span><input type="text" id="ev" placeholder="e.g. KOM-MZ-LEG-2026-014"></label>
      <div class="actions"><button class="btn primary" onclick="doResolve('${id}')">Attach and release</button>
      <button class="btn" onclick="closeModal()">Cancel</button></div>`);
  } else {
    modal(`<h2>${id}</h2><p>Decision brief: options, consequences and a recommendation, with the reasoning behind it.</p>
      <p style="color:var(--ink-3);font-size:12px">${type==='ONE_WAY'?'This decision cannot be reversed once the first record loads. Two named approvers are required.':'Recorded on the chain with the decider named.'}</p>
      <div class="actions"><button class="btn primary" onclick="closeModal();toast('Brief sent to the decision owner.','run')">Send to owner</button>
      <button class="btn" onclick="closeModal()">Close</button></div>`);
  }
}
function doResolve(id){const e=$('ev').value.trim();
  if(!e){toast('A signed source reference is required. The platform does not accept an unsourced statutory value.','stop');return}
  S.dps=S.dps.filter(d=>d.id!==id);
  const g=S.gates.find(x=>x.blocked===id);if(g){g.blocked=null;g.status='call';}
  closeModal();render();toast('DP-B14 released. Mozambique Time Off and six downstream stations are open.','run');}
function stopLine(){
  if(S.lineStopped){S.lineStopped=false;S.stopReason='';render();toast('Line restarted.','run');return}
  modal(`<h2>Stop the line</h2><p>Anyone can stop the line. Everything in flight pauses until a reviewer clears the halt — that is the point of the cord.</p>
    <label class="f"><span>What did you see?</span><textarea id="hr" placeholder="Describe what looks wrong"></textarea></label>
    <div class="actions"><button class="btn stop" onclick="doStop()">Stop the line</button>
    <button class="btn" onclick="closeModal()">Cancel</button></div>`);}
function doStop(){const r=$('hr').value.trim();
  if(!r){toast('Say what you saw. The reason is what makes a halt useful.','stop');return}
  S.lineStopped=true;S.stopReason=r;closeModal();render();toast('Line stopped. Everyone can see why.','stop');}
function breakChain(){S.chainOk=false;render();toast('Chain verification failed. Approvals are suspended.','stop');
  $('footState').textContent='Chain verification FAILED · approvals suspended';}

/* ================= render ================= */
function render(){
  $('nav').innerHTML=VIEWS.map(([k,l])=>`<button ${S.view===k?'aria-current="page"':''} onclick="go('${k}')">${l}</button>`).join('');
  $('railLamps').innerHTML=LAMP_PHASES.map(([p,s])=>{
    let st=s; if(S.lineStopped) st = s==='off'?'off':'stop';
    return `<div class="lamp" data-s="${st}" title="${p}"><span>${p}</span></div>`}).join('');
  if(S.loading){$('view').innerHTML=`<p class="eyebrow">Loading</p><h1>Reading the line</h1>
    <p class="sub">Pulling live state from the tenant. Nothing is shown until it is verified.</p>
    <div class="grid g3">${'<div class="card skel" style="height:132px"></div>'.repeat(3)}</div>
    <div class="skel" style="height:220px;margin-top:14px"></div>`;return;}
  if(!S.engagementLoaded){$('view').innerHTML=`<div class="empty"><h2>No engagement loaded</h2>
    <p>Load a signed design set to begin. JIDOKA builds the plan from it — it will not start from a blank page.</p>
    <button class="btn primary" onclick="S.engagementLoaded=true;render()">Load design set</button></div>`;return;}
  $('view').innerHTML={line:vLine,handover:vHandover,impact:vImpact,gates:vGates,decisions:vDecisions,evidence:vEvidence,analytics:vAnalytics}[S.view]();
}
function go(v){S.view=v;render();window.scrollTo({top:0})}
$('cordBtn').addEventListener('click',stopLine);
window.addEventListener('offline',()=>{S.offline=true;render()});
window.addEventListener('online',()=>{S.offline=false;render();toast('Back online.','run')});

const CMDS=[
 ['Go to Line','go("line")'],['Go to Handover','go("handover")'],['Go to Impact','go("impact")'],
 ['Go to Gates','go("gates")'],['Go to Decisions','go("decisions")'],['Go to Evidence','go("evidence")'],
 ['Go to Analytics','go("analytics")'],['Stop the line','stopLine()'],
 ['Export evidence bundle','toast("Evidence bundle exported.","run")'],
 ['Open DP-B14 brief','resolveDP("DP-B14","STATUTORY")'],
 ['Time travel: state as of 15 Oct','toast("Reconstructed from the ledger: 14 gates earned, DP-B14 open, line running.","")']];
function openPalette(){
  modal(`<h2 style="margin-bottom:10px">Where to?</h2>
    <label class="f"><span>Type a command</span><input type="text" id="pal" placeholder="line, stop, evidence, dp…"></label>
    <div id="palList"></div>`,()=>{
    const inp=document.getElementById('pal'), list=document.getElementById('palList');
    let sel=0, cur=CMDS;
    const draw=()=>{list.innerHTML=cur.map((c,i)=>`<div style="padding:8px 10px;border-radius:7px;font-size:13px;cursor:pointer;
      background:${i===sel?'var(--nxt)':'transparent'};color:${i===sel?'#fff':'var(--ink-2)'}"
      onclick="closeModal();${c[1]}">${c[0]}</div>`).join('')};
    draw();
    inp.addEventListener('input',()=>{cur=CMDS.filter(c=>c[0].toLowerCase().includes(inp.value.toLowerCase()));sel=0;draw()});
    inp.addEventListener('keydown',e=>{
      if(e.key==='ArrowDown'){sel=Math.min(sel+1,cur.length-1);draw();e.preventDefault()}
      if(e.key==='ArrowUp'){sel=Math.max(sel-1,0);draw();e.preventDefault()}
      if(e.key==='Enter'&&cur[sel]){const a=cur[sel][1];closeModal();eval(a)}});
  });
}
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette()}});

document.addEventListener('keydown',e=>{ // keyboard: 1-5 switch views
  if(e.target.matches('input,textarea'))return;
  const i=parseInt(e.key)-1; if(i>=0&&i<VIEWS.length) go(VIEWS[i][0]);});
setTimeout(()=>{S.loading=false;render();toast('Line state verified against the tenant.','run')},900);
render();
</script>
</body>
</html>
